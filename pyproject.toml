[project]
name = "hexlet-code"
version = "0.1.0"
description = "Gendiff - a utility for comparing two configuration files"
authors = [
    {name = "Roman Agarkov", email = ""},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["gendiff"]
omit = ["gendiff/scripts/*"]

[tool.coverage.report]
fail_under = 80
