[project]
name = "hexlet-code"
version = "0.1.0"
description = "Gendiff - a utility for comparing two configuration files"
authors = [
    {name = "Roman Agarkov", email = ""},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gendiff"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]

[project.scripts]
gendiff = "gendiff.scripts.gendiff:main"
